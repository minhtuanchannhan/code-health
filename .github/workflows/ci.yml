name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell syntax
        run: bash -n install.sh scripts/code-health/collect-baseline.sh tests/*.sh plugins/code-health/skills/code-health/scripts/collect-baseline.sh

      - name: Run ShellCheck
        run: shellcheck install.sh scripts/code-health/collect-baseline.sh tests/*.sh plugins/code-health/skills/code-health/scripts/collect-baseline.sh

      - name: Test installer
        run: ./tests/install-test.sh

      - name: Test release package
        run: ./tests/release-test.sh
